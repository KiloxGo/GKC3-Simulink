<g fill="#163346" stroke="#35586C"><rect x="64" y="252" width="252" height="92" rx="12"/><rect x="402" y="252" width="252" height="92" rx="12"/><rect x="740" y="252" width="252" height="92" rx="12"/><rect x="1078" y="252" width="298" height="92" rx="12"/></g>
