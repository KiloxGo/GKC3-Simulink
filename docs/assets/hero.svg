<g fill="#91B2C6" font-size="16"><text x="190" y="321">10 kV droop control</text><text x="528" y="321">Bidirectional average model</text><text x="866" y="321">2 kHz PWM / 2 µs dead time</text><text x="1227" y="321">Mutual inductance / variable R-L</text></g>
