<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">GKC3-Simulink</title><desc id="desc">Tokamak power supply simulation: grid, converter, H bridge and coupled load.</desc>
