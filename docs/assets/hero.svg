<text x="64" y="72" fill="#5CE1CC" font-family="Arial,sans-serif" font-size="15" letter-spacing="3">POWER ELECTRONICS / CONTROL / SIMULATION</text>
<text x="60" y="148" fill="#F4F8FC" font-family="Arial,sans-serif" font-size="64" font-weight="700">GKC3-Simulink</text>
<text x="64" y="194" fill="#B7CDDC" font-family="Arial,sans-serif" font-size="23">A connected electrical model. A reproducible path from grid to plasma.</text>
